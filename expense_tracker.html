<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expense Tracker</title>
    <link rel="stylesheet" href="expense_tracker.css">
</head>
<body>

    <div class="container">
        <h2>Expense Tracker</h2>

        <!-- Summary Cards -->
        <div class="summary-card">
            <div>
                <h4>Total Balance</h4>
                <h3 id="balance">$0.00</h3>
            </div>
            <div class="income-expense">
                <p>Income: <span id="income">$0.00</span></p>
                <p>Expense: <span id="expense">$0.00</span></p>
            </div>
        </div>

        <!-- Transaction History List -->
        <h3>History</h3>
        <ul id="transactionList" class="transaction-list">
            <!-- JavaScript se transactions yahan aayengi -->
        </ul>

        <!-- Add New Transaction Form -->
        <h3>Add New Transaction</h3>
        <form id="form">
            <div class="form-control">
                <label for="text">Description</label>
                <input type="text" id="text" placeholder="Enter text..." />
            </div>
            <div class="form-control">
                <label for="amount">
                    Amount <br />
                    <small>(negative = expense, positive = income)</small>
                </label>
                <input type="number" id="amount" placeholder="Enter amount..." />
            </div>
            <button class="btn" type="submit">Add transaction</button>
        </form>
    </div>

    <script src="expense_tracker.js"></script>
</body>
</html>
